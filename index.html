  if(t===0)return{q:Q(`Найдите sin α, если cos α = ${rh(cosv)} и ${iv}.`),a:rv(sinv),ans:rh(sinv),steps:[`sin²α = 1 − cos²α = 1 − ${F(A*A,C*C)} = ${F(B*B,C*C)}, |sin α| = ${F(B,C)}.`,`α в ${qn} четверти, там синус ${ss>0?'положителен':'отрицателен'}: sin α = ${rh(sinv)}.`]};
  if(t===1)return{q:Q(`Найдите cos α, если sin α = ${rh(sinv)} и ${iv}.`),a:rv(cosv),ans:rh(cosv),steps:[`cos²α = 1 − sin²α = 1 − ${F(B*B,C*C)} = ${F(A*A,C*C)}, |cos α| = ${F(A,C)}.`,`α в ${qn} четверти, там косинус ${cs>0?'положителен':'отрицателен'}: cos α = ${rh(cosv)}.`]};
  return{q:Q(`Найдите tg α, если cos α = ${rh(cosv)} и ${iv}.`),a:rv(tg),ans:rh(tg),steps:[`sin²α = 1 − ${F(A*A,C*C)} = ${F(B*B,C*C)}; в ${qn} четверти sin α = ${rh(sinv)}.`,`tg α = ${F('sin α','cos α')} = ${rh(sinv)} : ${rhP(cosv)} = ${rh(tg)}.`]}}
 const t=rnz(-5,5);let a,b,c,d;do{a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5)}while(c*t+d===0||a*t+b===0);const res=R(a*t+b,c*t+d),s=' sin α',co=' cos α',tgv=' tg α';
 return{q:Q(`Найдите значение выражения, если tg α = ${N(t)}:`,F(poly([[a,s],[b,co]]),poly([[c,s],[d,co]]))),a:rv(res),ans:rh(res),steps:[`Так как tg α определён, cos α ≠ 0. Делим числитель и знаменатель на cos α:`,`${F(poly([[a,tgv],[b,'']]),poly([[c,tgv],[d,'']]))} = ${F(`${N(a)} · ${P(t)}${sg(b)}`,`${N(c)} · ${P(t)}${sg(d)}`)} = ${F(N(a*t+b),N(c*t+d))}${(a*t+b===res.n&&c*t+d===res.d)?'':` = ${rh(res)}`}.`]}}},

{id:'deriv',g:10,t:'Производная',d:'Правила дифференцирования, касательная, точки экстремума.',
th:`<h3>Смысл</h3><p>Производная <i>f</i>′(${sub(X,0)}) — скорость изменения функции в точке и угловой коэффициент касательной к графику в этой точке.</p>
<h3>Таблица и правила</h3><div class="rule"><div>(<i>C</i>)′ = 0 &nbsp;&nbsp; (<i>x</i><sup><i>n</i></sup>)′ = <i>n</i><i>x</i><sup><i>n</i> − 1</sup> &nbsp;&nbsp; (<i>kx</i> + <i>b</i>)′ = <i>k</i></div><div>(<i>u</i> ± <i>v</i>)′ = <i>u</i>′ ± <i>v</i>′ &nbsp;&nbsp; (<i>Cu</i>)′ = <i>Cu</i>′</div><div>(<i>uv</i>)′ = <i>u</i>′<i>v</i> + <i>uv</i>′</div></div>
<div class="rule">(3${X3} − 5${X2} + 2)′ = 9${X2} − 10${X}</div>
<h3>Касательная</h3><div class="rule">${Y} = <i>f</i>(${sub(X,0)}) + <i>f</i>′(${sub(X,0)})(${X} − ${sub(X,0)})</div>
<h3>Возрастание, убывание, экстремумы</h3><p>Где <i>f</i>′ > 0, функция возрастает, где <i>f</i>′ < 0 — убывает. Если в точке производная меняет знак с «−» на «+», это <b>точка минимума</b>, с «+» на «−» — <b>точка максимума</b>.</p>`,
gen(l){
 if(l===1){const a=rnz(-5,5),b=rnz(-9,9),c=rnz(-9,9),x0=rnz(-5,5),r=2*a*x0+b;
  return{q:Q(`Найдите <i>f</i>′(${N(x0)}), если`,`<i>f</i>(${X}) = ${poly([[a,X2],[b,X],[c,'']])}`),a:r,steps:[`<i>f</i>′(${X}) = ${poly([[2*a,X],[b,'']])}.`,`<i>f</i>′(${N(x0)}) = ${N(2*a)} · ${P(x0)}${sg(b)} = ${N(r)}.`]}}
 if(l===2){const a=rnz(-3,3),b=rnz(-5,5),c=rnz(-9,9),d=ri(-9,9),x0=rnz(-3,3),r=3*a*x0*x0+2*b*x0+c;
  return{q:Q(`Найдите <i>f</i>′(${N(x0)}), если`,`<i>f</i>(${X}) = ${poly([[a,X3],[b,X2],[c,X],[d,'']])}`),a:r,steps:[`(<i>x</i><sup><i>n</i></sup>)′ = <i>nx</i><sup><i>n</i> − 1</sup>, производная константы равна 0.`,`<i>f</i>′(${X}) = ${poly([[3*a,X2],[2*b,X],[c,'']])}.`,`<i>f</i>′(${N(x0)}) = ${N(3*a)} · ${P(x0)}²${sg(2*b)} · ${P(x0)}${sg(c)} = ${N(r)}.`]}}
 if(coin()){const k=ri(1,5),c=ri(-9,9),mn=coin();
  return{q:Q(`Найдите точку ${mn?'минимума':'максимума'} функции`,`<i>f</i>(${X}) = ${poly([[1,X3],[-3*k*k,X],[c,'']])}`),a:mn?k:-k,steps:[`<i>f</i>′(${X}) = 3${X2} − ${3*k*k}.`,`<i>f</i>′(${X}) = 0 при ${X2} = ${k*k}, ${X} = ±${k}.`,`Знаки <i>f</i>′: «+» при ${X} < −${k}, «−» между −${k} и ${k}, «+» при ${X} > ${k}.`,`В точке ${k} знак меняется с «−» на «+» — минимум; в точке −${k} — с «+» на «−», максимум.`]}}
 const a=rnz(-3,3),b=rnz(-6,6),c=rnz(-9,9),x0=rnz(-4,4),f0=a*x0*x0+b*x0+c,k=2*a*x0+b,i0=f0-k*x0;
 return{q:Q(`К графику функции <i>f</i>(${X}) = ${poly([[a,X2],[b,X],[c,'']])} проведена касательная в точке с абсциссой ${sub(X,0)} = ${N(x0)}. Найдите ординату точки пересечения касательной с осью O${Y}.`),a:i0,steps:[`<i>f</i>(${N(x0)}) = ${N(f0)}.`,`<i>f</i>′(${X}) = ${poly([[2*a,X],[b,'']])}, <i>f</i>′(${N(x0)}) = ${N(k)}.`,`Касательная: ${Y} = ${N(f0)} + ${P(k)}(${X} − ${P(x0)}) = ${poly([[k,X],[i0,'']])}.`,`При ${X} = 0: ${Y} = ${N(i0)}.`]}}},

/* ---------- 11 класс ---------- */
{id:'integral',g:11,t:'Интеграл',d:'Первообразная, формула Ньютона — Лейбница, площадь криволинейной фигуры.',
th:`<h3>Первообразная</h3><p><i>F</i>(${X}) — первообразная для <i>f</i>(${X}), если <i>F</i>′(${X}) = <i>f</i>(${X}). Первообразные отличаются на постоянную <i>C</i>.</p>
<div class="rule"><div><i>k</i> → <i>kx</i> &nbsp;&nbsp; <i>x</i><sup><i>n</i></sup> → ${F('<i>x</i><sup><i>n</i> + 1</sup>','<i>n</i> + 1')}</div><div>2${X} → ${X2} &nbsp;&nbsp; 3${X2} → ${X3}</div></div>
<h3>Формула Ньютона — Лейбница</h3><div class="rule">${INT('<i>a</i>','<i>b</i>')}<i>f</i>(${X})<i>dx</i> = <i>F</i>(<i>b</i>) − <i>F</i>(<i>a</i>)</div>
<div class="rule">${INT(1,3)}2${X} <i>dx</i> = 3² − 1² = 8</div>
<h3>Площадь фигуры</h3><p>Площадь между графиками ${Y} = <i>f</i>(${X}) (сверху) и ${Y} = <i>g</i>(${X}) (снизу) на отрезке [<i>a</i>; <i>b</i>]:</p><div class="rule"><i>S</i> = ${INT('<i>a</i>','<i>b</i>')}(<i>f</i>(${X}) − <i>g</i>(${X}))<i>dx</i></div>
<p class="note">Пределы интегрирования часто — абсциссы точек пересечения графиков. Найдите их первыми.</p>`,
gen(l){
 if(l===1){if(coin()){const k=ri(1,4),p=ri(0,3),q=ri(p+1,p+4),r=k*(q*q-p*p),kk=k===1?'':k+' · ';
   return{q:Q('Вычислите:',`${INT(p,q)}${poly([[2*k,X]])} <i>dx</i>`),a:r,steps:[`Первообразная: <i>F</i>(${X}) = ${poly([[k,X2]])}.`,`<i>F</i>(${q}) − <i>F</i>(${p}) = ${kk}${q}² − ${kk}${p}² = ${k*q*q} − ${k*p*p} = ${r}.`]}}
  const p=ri(0,2),q=ri(p+1,3);return{q:Q('Вычислите:',`${INT(p,q)}3${X2} <i>dx</i>`),a:q**3-p**3,steps:[`Первообразная: <i>F</i>(${X}) = ${X3}.`,`<i>F</i>(${q}) − <i>F</i>(${p}) = ${q}³ − ${p}³ = ${q**3} − ${p**3} = ${q**3-p**3}.`]}}
 if(l===2){let a,b,c;do{a=ri(-2,2);b=ri(-3,3);c=ri(-5,5)}while(!a&&!b||!a&&!c||!b&&!c);const p=ri(0,1),q=ri(2,3),Fv=x=>a*x**3+b*x*x+c*x,Fq=Fv(q),Fp=Fv(p);
  return{q:Q('Вычислите:',`${INT(p,q)}(${poly([[3*a,X2],[2*b,X],[c,'']])})<i>dx</i>`),a:Fq-Fp,steps:[`Первообразная: <i>F</i>(${X}) = ${poly([[a,X3],[b,X2],[c,X]])}.`,`<i>F</i>(${q}) = ${N(Fq)}, <i>F</i>(${p}) = ${N(Fp)}.`,`Интеграл: ${N(Fq)} − ${P(Fp)} = ${N(Fq-Fp)}.`]}}
 if(coin()){const m=ri(1,6),r=R(m**3,6);
  return{q:Q(`Найдите площадь фигуры, ограниченной параболой ${Y} = ${X2} и прямой ${Y} = ${poly([[m,X]])}.`),a:rv(r),ans:ansR(r),steps:[`Точки пересечения: ${X2} = ${poly([[m,X]])} ⇒ ${X} = 0 или ${X} = ${m}.`,`На [0; ${m}] прямая выше параболы: <i>S</i> = ${INT(0,m)}(${poly([[m,X]])} − ${X2})<i>dx</i>.`,`Первообразная: ${F(`${m===1?'':m}${X2}`,2)} − ${F(X3,3)}.`,`<i>S</i> = ${F(`${m} · ${m}²`,2)} − ${F(`${m}³`,3)} = ${rh(R(m**3,2))} − ${rh(R(m**3,3))} = ${rh(r)}.`]}}
 const k=ri(1,4),r=R(4*k**3,3);
 return{q:Q(`Найдите площадь фигуры, ограниченной параболой ${Y} = ${k*k} − ${X2} и осью O${X}.`),a:rv(r),ans:ansR(r),steps:[`Парабола пересекает ось O${X} в точках ${X} = ±${k}.`,`<i>S</i> = ${INT(-k,k)}(${k*k} − ${X2})<i>dx</i>; первообразная <i>F</i>(${X}) = ${k*k===1?'':k*k}${X} − ${F(X3,3)}.`,`<i>F</i>(${k}) − <i>F</i>(−${k}) = 2(${k**3} − ${F(k**3,3)}) = ${rh(r)}.`]}}},

{id:'volume',g:11,t:'Объёмы тел',d:'Параллелепипед, куб, цилиндр, конус, пирамида, шар.',
th:`<h3>Формулы объёмов</h3><div class="rule"><div>Прямоугольный параллелепипед: <i>V</i> = <i>abc</i>; куб: <i>V</i> = <i>a</i>³</div><div>Призма и цилиндр: <i>V</i> = ${sub('<i>S</i>','осн')} · <i>h</i>; цилиндр: <i>V</i> = π<i>r</i>²<i>h</i></div><div>Пирамида и конус: <i>V</i> = ${F(1,3)}${sub('<i>S</i>','осн')} · <i>h</i>; конус: <i>V</i> = ${F(1,3)}π<i>r</i>²<i>h</i></div><div>Шар: <i>V</i> = ${F(4,3)}π<i>r</i>³</div></div>
<h3>Ответ «делённый на π»</h3><p>Чтобы не возиться с приближённым значением π, в задачах часто просят указать <i>V</i>/π. Например, для цилиндра с <i>r</i> = 3, <i>h</i> = 5: <i>V</i> = 45π, <i>V</i>/π = 45.</p>
<h3>Конус: высота через образующую</h3><p>Радиус основания <i>r</i>, высота <i>h</i> и образующая <i>l</i> образуют прямоугольный треугольник: <i>h</i> = ${S('<i>l</i>² − <i>r</i>²')}.</p>
<p class="note">Объём измеряется в кубических единицах: см³, м³. 1 л = 1 дм³.</p>`,
gen(l){
 if(l===1){if(coin()){const a=ri(2,15),b=ri(2,15),c=ri(2,15);return{q:Q(`Измерения прямоугольного параллелепипеда равны ${a}, ${b} и ${c}. Найдите его объём.`),a:a*b*c,steps:[`<i>V</i> = <i>abc</i> = ${a} · ${b} · ${c} = ${a*b*c}.`]}}
  const a=ri(2,12);return{q:Q(`Найдите объём куба с ребром ${a}.`),a:a**3,steps:[`<i>V</i> = <i>a</i>³ = ${a}³ = ${a**3}.`]}}
 if(l===2){if(coin()){const r=ri(1,10),h=ri(1,15);return{q:Q(`Радиус основания цилиндра равен ${r}, высота — ${h}. Найдите объём цилиндра, делённый на π.`),a:r*r*h,steps:[`<i>V</i> = π<i>r</i>²<i>h</i>, значит <i>V</i>/π = <i>r</i>²<i>h</i>.`,`${r}² · ${h} = ${r*r} · ${h} = ${r*r*h}.`]}}
  const r=ri(1,9),h=3*ri(1,6);return{q:Q(`Радиус основания конуса равен ${r}, высота — ${h}. Найдите объём конуса, делённый на π.`),a:r*r*h/3,steps:[`<i>V</i> = ${F(1,3)}π<i>r</i>²<i>h</i>, значит <i>V</i>/π = ${F('<i>r</i>²<i>h</i>',3)}.`,`${F(`${r}² · ${h}`,3)} = ${F(r*r*h,3)} = ${r*r*h/3}.`]}}
 const t=ri(0,2);
 if(t===0){const r=ri(1,6),v=R(4*r**3,3);return{q:Q(`Радиус шара равен ${r}. Найдите объём шара, делённый на π.`),a:rv(v),ans:ansR(v),steps:[`<i>V</i> = ${F(4,3)}π<i>r</i>³, значит <i>V</i>/π = ${F('4<i>r</i>³',3)}.`,`${F(`4 · ${r**3}`,3)} = ${rh(v)}.`]}}
 if(t===1){const[r,h,lv]=triple(30),v=R(r*r*h,3);return{q:Q(`Образующая конуса равна ${lv}, радиус основания — ${r}. Найдите объём конуса, делённый на π.`),a:rv(v),ans:ansR(v),steps:[`Высота: <i>h</i> = ${S(`${lv}² − ${r}²`)} = ${S(h*h)} = ${h}.`,`<i>V</i>/π = ${F(`${r}² · ${h}`,3)} = ${F(r*r*h,3)}${v.d===1?` = ${N(rv(v))}`:''}.`]}}
 const a=ri(2,12),h=ri(3,15),v=R(a*a*h,3);return{q:Q(`Сторона основания правильной четырёхугольной пирамиды равна ${a}, высота — ${h}. Найдите объём пирамиды.`),a:rv(v),ans:ansR(v),steps:[`В основании квадрат: ${sub('<i>S</i>','осн')} = ${a}² = ${a*a}.`,`<i>V</i> = ${F(1,3)} · ${a*a} · ${h} = ${rh(v)}.`]}}},

{id:'ineq',g:11,t:'Неравенства',d:'Линейные и квадратные неравенства, метод интервалов.',
th:`<h3>Линейные неравенства</h3><p>Решаются как уравнения, но с одним важным правилом:</p><div class="rule">при умножении или делении на <b>отрицательное</b> число знак неравенства меняется на противоположный</div>
<div class="rule">−3${X} + 2 > 11 &nbsp;⇒&nbsp; −3${X} > 9 &nbsp;⇒&nbsp; ${X} < −3</div>
<h3>Квадратные неравенства</h3><p>Найдите корни трёхчлена и вспомните форму параболы. При <i>a</i> > 0 ветви направлены вверх: трёхчлен отрицателен между корнями и положителен вне их.</p>
<div class="rule">${X2} − 5${X} + 4 ≤ 0 &nbsp;⇒&nbsp; корни 1 и 4 &nbsp;⇒&nbsp; ${X} ∈ [1; 4]</div>
<h3>Метод интервалов</h3><p>Для дробей вида ${F(`${X} − <i>a</i>`,`${X} − <i>b</i>`)}: отметьте нули числителя и знаменателя на прямой, определите знак на каждом промежутке. Нуль знаменателя всегда «выколот» — делить на ноль нельзя.</p>
<p class="note">Квадратная скобка [ ] означает, что конец входит в решение, круглая ( ) — не входит.</p>`,
gen(l){
 if(l===1){let a;do a=rnz(-6,6);while(Math.abs(a)<2);const b=rnz(-15,15),c=ri(-20,20),s0=pick(['>','≥','<','≤']),flip={'>':'<','<':'>','≥':'≤','≤':'≥'},s=a<0?flip[s0]:s0,B=R(c-b,a),fl=Math.floor(B.n/B.d),ce=Math.ceil(B.n/B.d),up=s==='>'||s==='≥';
  const ans=s==='>'?fl+1:s==='≥'?ce:s==='<'?ce-1:fl;
  return{q:Q(`Найдите ${up?'наименьшее':'наибольшее'} целое решение неравенства:`,`${poly([[a,X],[b,'']])} ${s0} ${N(c)}`),a:ans,steps:[`Переносим ${N(b)} вправо: ${poly([[a,X]])} ${s0} ${N(c-b)}.`,`Делим на ${P(a)}${a<0?' — число отрицательное, знак неравенства меняется':''}: ${X} ${s} ${rh(B)}.`,`${up?'Наименьшее':'Наибольшее'} целое число, удовлетворяющее условию: ${N(ans)}.`]}}
 if(l===2){const r1=ri(-6,5),r2=r1+ri(2,8),s=coin()?'≤':'<',p=-(r1+r2),q=r1*r2,ints=[];for(let i=r1;i<=r2;i++)if(s==='≤'||i!==r1&&i!==r2)ints.push(N(i));
  return{q:Q('Сколько целых решений имеет неравенство?',`${poly([[1,X2],[p,X],[q,'']])} ${s} 0`),a:ints.length,steps:[`Корни трёхчлена: ${X} = ${N(r1)} и ${X} = ${N(r2)} (по Виета: сумма ${N(r1+r2)}, произведение ${N(q)}).`,`Ветви параболы направлены вверх, поэтому трёхчлен ${s==='≤'?'неположителен':'отрицателен'} между корнями: ${X} ∈ ${s==='≤'?'[':'('}${N(r1)}; ${N(r2)}${s==='≤'?']':')'}.`,`Целые решения: ${ints.join('; ')}. Их ${ints.length}.`]}}
 let a,b;do{a=ri(-6,6);b=ri(-6,6)}while(Math.abs(a-b)<2||Math.abs(a-b)>8);const s=coin()?'≤':'<',lo=Math.min(a,b),hi=Math.max(a,b),ints=[];for(let i=lo;i<=hi;i++)if(i!==b&&(i!==a||s==='≤'))ints.push(N(i));
 const iv=a<b?`${s==='≤'?'[':'('}${N(a)}; ${N(b)})`:`(${N(b)}; ${N(a)}${s==='≤'?']':')'}`;
 return{q:Q('Сколько целых решений имеет неравенство?',`${F(`${X}${sg(-a)}`,`${X}${sg(-b)}`)} ${s} 0`),a:ints.length,steps:[`Нуль числителя: ${X} = ${N(a)}; нуль знаменателя: ${X} = ${N(b)} (эта точка выколота).`,`Дробь отрицательна, когда числитель и знаменатель разных знаков, то есть между ${N(lo)} и ${N(hi)}.`,`Решение: ${X} ∈ ${iv}.`,`Целые решения: ${ints.join('; ')}. Их ${ints.length}.`]}}},

{id:'word',g:11,t:'Текстовые задачи',d:'Движение, совместная работа, смеси и растворы, движение по реке.',
th:`<h3>Движение</h3><div class="rule"><i>s</i> = <i>v</i> · <i>t</i> &nbsp;&nbsp; навстречу: ${sub('<i>v</i>','сбл')} = ${sub('<i>v</i>',1)} + ${sub('<i>v</i>',2)} &nbsp;&nbsp; вдогонку: ${sub('<i>v</i>','сбл')} = ${sub('<i>v</i>',1)} − ${sub('<i>v</i>',2)}</div>
<p>По реке: по течению скорость <i>v</i> + <i>u</i>, против течения — <i>v</i> − <i>u</i>, где <i>u</i> — скорость течения.</p>
<h3>Совместная работа</h3><p>Всю работу принимают за 1. Если один выполняет её за <i>a</i> ч, его производительность ${F(1,'<i>a</i>')} работы в час. Производительности при совместной работе складываются.</p><div class="rule"><i>t</i> = 1 : (${F(1,'<i>a</i>')} + ${F(1,'<i>b</i>')}) = ${F('<i>ab</i>','<i>a</i> + <i>b</i>')}</div>
<h3>Смеси и растворы</h3><p>Масса вещества = масса раствора × концентрация. При смешивании складываются массы вещества и массы растворов.</p>
<h3>Общий план</h3><ol><li>Обозначьте неизвестное буквой.</li><li>Выразите через него остальные величины (удобно в таблице).</li><li>Составьте уравнение и решите его.</li><li>Проверьте, подходит ли корень по смыслу задачи.</li></ol>`,
gen(l){
 if(l===1){if(coin()){const t=ri(2,6),v1=ri(4,9)*10,v2=ri(4,9)*10,Sd=(v1+v2)*t;
   return{q:Q(`Из двух городов, расстояние между которыми ${Sd} км, одновременно навстречу друг другу выехали два автомобиля со скоростями ${v1} км/ч и ${v2} км/ч. Через сколько часов они встретятся?`),a:t,steps:[`Скорость сближения: ${v1} + ${v2} = ${v1+v2} км/ч.`,`<i>t</i> = ${Sd} : ${v1+v2} = ${t} ч.`]}}
  const t=ri(2,6);let v1,v2;do{v1=ri(5,12)*5;v2=ri(2,10)*5}while(v1<=v2);const d=(v1-v2)*t;
  return{q:Q(`Велосипедист едет со скоростью ${v2} км/ч. Вслед за ним из той же точки, когда расстояние между ними было ${d} км, выехал мотоциклист со скоростью ${v1} км/ч. Через сколько часов мотоциклист догонит велосипедиста?`),a:t,steps:[`Скорость сближения при движении вдогонку: ${v1} − ${v2} = ${v1-v2} км/ч.`,`<i>t</i> = ${d} : ${v1-v2} = ${t} ч.`]}}
 if(l===2){if(coin()){const[a,b]=pick([[3,6],[4,12],[6,12],[10,15],[12,24],[20,30],[6,30],[5,20],[12,36],[15,30],[24,40]]),t=a*b/(a+b),sm=R(a+b,a*b);
   return{q:Q(`Первая труба наполняет бассейн за ${a} ч, вторая — за ${b} ч. За сколько часов наполнят бассейн обе трубы, работая вместе?`),a:t,steps:[`Объём бассейна примем за 1. Производительности: ${F(1,a)} и ${F(1,b)} бассейна в час.`,`Вместе: ${F(1,a)} + ${F(1,b)} = ${rh(sm)} бассейна в час.`,`Время: 1 : ${rh(sm)} = ${t} ч.`]}}
  let m1,m2,p1,p2;do{m1=ri(1,9);m2=ri(1,9);p1=ri(1,12)*5;p2=ri(1,12)*5}while(p1===p2||((m1*p1+m2*p2)*100)%(m1+m2));const salt=(m1*p1+m2*p2)/100,res=(m1*p1+m2*p2)/(m1+m2);
  return{q:Q(`Смешали ${m1} кг ${p1}-процентного раствора соли и ${m2} кг ${p2}-процентного раствора соли. Какова концентрация (в процентах) получившегося раствора?`),a:res,steps:[`Соли в первом растворе: ${m1} · ${N(p1/100)} = ${N(m1*p1/100)} кг, во втором: ${m2} · ${N(p2/100)} = ${N(m2*p2/100)} кг.`,`Всего соли ${N(salt)} кг, масса смеси ${m1+m2} кг.`,`Концентрация: ${N(salt)} : ${m1+m2} · 100% = ${N(res)}%.`]}}
 let v,c,s,T;do{v=ri(8,20);c=ri(1,4);const L=lcm(v+c,v-c);s=L*ri(1,3);T=s/(v+c)+s/(v-c)}while(s>300);const D4=s*s+T*T*c*c,sd=T*v-s;
 return{q:Q(`Моторная лодка прошла ${s} км по течению реки и вернулась обратно, затратив на весь путь ${T} ч. Скорость течения ${c} км/ч. Найдите собственную скорость лодки (в км/ч).`),a:v,steps:[`Пусть ${X} км/ч — собственная скорость лодки. По течению: ${X} + ${c}, против течения: ${X} − ${c}.`,`${F(s,`${X} + ${c}`)} + ${F(s,`${X} − ${c}`)} = ${T}.`,`Умножаем на (${X} + ${c})(${X} − ${c}): ${s}(${X} − ${c}) + ${s}(${X} + ${c}) = ${T}(${X2} − ${c*c}).`,`${poly([[T,X2],[-2*s,X],[-T*c*c,'']])} = 0.`,`<i>D</i>/4 = ${s}² + ${T} · ${T*c*c} = ${D4} = ${sd}²; ${X} = ${F(`${s} + ${sd}`,T)} = ${v} (второй корень отрицательный и не подходит).`]}}},
];
const TOPIC={};TOPICS.forEach((t,i)=>{TOPIC[t.id]=t});
const GRADES=[5,6,7,8,9,10,11];
const LV=[{n:1,name:'Базовый',desc:'Понять правило и применить его в простых примерах'},{n:2,name:'Средний',desc:'Типовые задачи, как на школьных контрольных'},{n:3,name:'Продвинутый',desc:'Несколько шагов и нестандартные формулировки'}];
const NEED=5;

/* ================= хранилище ================= */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let progress=store.get('shm.progress.v1',{});if(!progress||typeof progress!=='object')progress={};
const prog=id=>{const p=progress[id];return Array.isArray(p)?p:[0,0,0]};
const done=(id,l)=>prog(id)[l-1]>=NEED;
function bump(id,l){const p=prog(id).slice();p[l-1]=Math.min(NEED,(p[l-1]||0)+1);progress[id]=p;store.set('shm.progress.v1',progress)}
const masteredCount=list=>list.reduce((s,t)=>s+[1,2,3].filter(l=>done(t.id,l)).length,0);

/* ================= тема ================= */
const root=document.documentElement;
function setTheme(t){if(t==='light'||t==='dark')root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');try{localStorage.setItem('shm.theme',t)}catch(e){}
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)))}
document.querySelectorAll('.theme button').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));
(function(){let t='auto';try{t=localStorage.getItem('shm.theme')||'auto'}catch(e){}setTheme(t)})();

/* ================= разметка ================= */
const app=document.getElementById('app');
const pill=(id,l)=>{const c=Math.min(prog(id)[l-1],NEED),d=c>=NEED;return`<span class="pill l${l}${d?' done':''}"><span class="dot" aria-hidden="true"></span>${LV[l-1].name} ${d?'✓<span class="sr"> освоен</span>':`${c}/${NEED}`}</span>`};
const pills=id=>`<div class="pills">${[1,2,3].map(l=>pill(id,l)).join('')}</div>`;

function renderHome(g){
 store.set('shm.grade',g);
 const list=TOPICS.filter(t=>t.g===g),all=masteredCount(TOPICS),total=TOPICS.length*3;
 const lvCounts=[1,2,3].map(l=>TOPICS.filter(t=>done(t.id,l)).length);
 document.title='Математика в клетку';
 app.innerHTML=`
 <section class="hero">
  <div><h1>Школьная математика<br>по полочкам</h1><p class="lead">Выберите класс и тему. В каждой теме — понятная теория, разобранные примеры и тренажёр на трёх уровнях сложности с бесконечным запасом задач.</p></div>
  <div class="sheet summary" aria-label="Общий прогресс">
   <div class="big">${all} <span>из ${total}</span></div>
   <div>уровней освоено</div>
   <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${all}" aria-label="Освоено уровней"><i style="width:${all/total*100}%"></i></div>
   <div class="legend">${[1,2,3].map(l=>`<span class="pill l${l}"><span class="dot" aria-hidden="true"></span>${LV[l-1].name}: ${lvCounts[l-1]}/${TOPICS.length}</span>`).join('')}</div>
  </div>
 </section>
 <nav aria-label="Классы"><ul class="grades">${GRADES.map(n=>{const ts=TOPICS.filter(t=>t.g===n);return`<li><a href="#/grade/${n}"${n===g?' aria-current="page"':''}><b>${n}</b><small>класс · ${masteredCount(ts)}/${ts.length*3}</small></a></li>`}).join('')}</ul></nav>
 <h2 style="margin-bottom:14px">${g} класс</h2>
 <div class="cards">${list.map((t,i)=>`<a class="card sheet" href="#/topic/${t.id}"><span class="num">§${i+1}</span><h3>${t.t}</h3><p>${t.d}</p>${pills(t.id)}</a>`).join('')}</div>`;
}

const exCache={};
function examples(t){if(!exCache[t.id])exCache[t.id]=[1,2].map(l=>withSeed(hashStr(t.id+':ex'+l),()=>t.gen(l)));return exCache[t.id]}
const solHTML=p=>`<ol class="sol">${p.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol><div class="answer">Ответ: <span class="m">${p.ans||N(p.a)}</span></div>`;

/* состояние тренажёра */
const TS={topic:null,level:1,p:null,tries:0,shown:false,solved:false};
function newProblem(){TS.p=TOPIC[TS.topic].gen(TS.level);TS.tries=0;TS.shown=false;TS.solved=false}

function renderTopic(id,tab,level){
 const t=TOPIC[id],idx=TOPICS.filter(x=>x.g===t.g).indexOf(t)+1;
 if(!['theory','examples','practice'].includes(tab))tab='theory';
 document.title=`${t.t} — Математика в клетку`;
 const tabs=[['theory','Теория'],['examples','Примеры'],['practice','Тренажёр']];
 let body='';
 if(tab==='theory')body=`<article class="sheet theory content">${t.th}</article><div class="next"><a class="btn" href="#/topic/${id}/examples">Посмотреть примеры →</a></div>`;
 else if(tab==='examples'){const ex=examples(t);body=`<div class="examples content">${ex.map((p,i)=>`<article class="sheet ex"><div class="tag">Пример ${i+1} <span class="pill l${i+1}">${LV[i].name} уровень</span></div><div class="task">${p.q}</div><h3 class="sr">Решение</h3>${solHTML(p)}</article>`).join('')}</div><div class="next"><a class="btn" href="#/topic/${id}/practice">Перейти к тренажёру →</a></div>`}
 else{
  const lv=level||(TS.topic===id?TS.level:([1,2,3].find(l=>!done(id,l))||1));
  if(TS.topic!==id||TS.level!==lv||!TS.p){TS.topic=id;TS.level=lv;newProblem()}
  body=`<div class="levels" role="group" aria-label="Уровень сложности">${LV.map(L=>{const c=Math.min(prog(id)[L.n-1],NEED);return`<a class="lvl l${L.n}" href="#/topic/${id}/practice/${L.n}" aria-current="${L.n===lv}"><span class="ln">${L.name}${c>=NEED?' <span>✓ освоен</span>':''}</span><small>${L.desc}</small><span class="dots" aria-label="Верно с первой попытки: ${c} из ${NEED}">${Array.from({length:NEED},(_,i)=>`<i class="${i<c?'on':''}"></i>`).join('')}</span></a>`}).join('')}</div><div id="trainer" class="content"></div>`;
 }
 app.innerHTML=`<nav class="crumbs" aria-label="Навигация"><a href="#/">Главная</a><span aria-hidden="true">/</span><a href="#/grade/${t.g}">${t.g} класс</a><span aria-hidden="true">/</span><span>${t.t}</span></nav>
 <div class="topic-head"><h1>${t.t}</h1>${pills(id)}</div>
 <nav class="tabs" aria-label="Разделы темы">${tabs.map(([k,n])=>`<a href="#/topic/${id}/${k}"${k===tab?' aria-current="page"':''}>${n}</a>`).join('')}</nav>${body}`;
 if(tab==='practice')renderTrainer();
}

function renderTrainer(){
 const box=document.getElementById('trainer');if(!box)return;
 const p=TS.p,L=LV[TS.level-1];
 box.innerHTML=`<section class="sheet prob" aria-labelledby="ptitle">
  <div class="prob-top"><h2 id="ptitle" style="font-size:30px">Задача</h2><span class="pill l${TS.level}">${L.name} уровень</span></div>
  <div class="task">${p.q}</div>
  <form class="ans" id="ansform" novalidate>
   <div class="field"><label for="answer">Ваш ответ</label>
    <input id="answer" autocomplete="off" spellcheck="false" autocapitalize="off" inputmode="text" ${TS.solved?'disabled':''} aria-describedby="anshint fb">
    <div class="keys" aria-label="Вставить символ">${['−','/',','].map(k=>`<button type="button" data-k="${k}" ${TS.solved?'disabled':''} aria-label="Вставить ${k==='−'?'минус':k==='/'?'дробную черту':'запятую'}">${k}</button>`).join('')}</div>
    <span class="hint" id="anshint">Целое число, десятичная дробь (0,75) или обыкновенная (3/4, 1 1/2)</span></div>
   <button class="btn" type="submit" ${TS.solved?'disabled':''}>Проверить</button>
  </form>
  <div id="fb" class="fb" aria-live="polite"></div>
  <div class="actions">
   <button class="btn ghost" type="button" id="showsol" ${TS.shown?'disabled':''}>Показать решение</button>
   <button class="btn ${TS.solved||TS.shown?'':'ghost'}" type="button" id="nextp">Следующая задача →</button>
  </div>
  <div id="solbox" class="solbox" ${TS.shown?'':'hidden'}><h3>Решение</h3>${solHTML(p)}</div>
 </section>`;
 const inp=box.querySelector('#answer'),fb=box.querySelector('#fb');
 box.querySelectorAll('.keys button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k,s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+k+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)}));
 box.querySelector('#ansform').addEventListener('submit',ev=>{ev.preventDefault();check(inp,fb)});
 box.querySelector('#showsol').addEventListener('click',()=>{TS.shown=true;renderTrainer();const sb=document.getElementById('solbox');sb.scrollIntoView({behavior:'smooth',block:'nearest'});document.getElementById('nextp').focus()});
 box.querySelector('#nextp').addEventListener('click',()=>{newProblem();renderTrainer();document.getElementById('answer').focus()});
}

function parseAns(s){
 s=s.trim().replace(/[−–—]/g,'-').replace(/,/g,'.').replace(/\s+/g,' ').replace(/\s*\/\s*/g,'/').replace(/^([+-])\s+/,'$1');
 if(!s)return null;let m;
 if(/^[+-]?\d{1,3}( \d{3})+(\.\d+)?$/.test(s))s=s.replace(/ /g,'');
 if(/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s))return parseFloat(s);
 if(m=s.match(/^([+-]?)(\d+) (\d+)\/(\d+)$/)){if(+m[4]===0)return NaN;const v=+m[2]+ +m[3]/+m[4];return m[1]==='-'?-v:v}
 if(m=s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/)){if(+m[2]===0)return NaN;return+m[1]/+m[2]}
 return NaN}
const same=(u,a)=>Math.abs(u-a)<=1e-9*Math.max(1,Math.abs(a));

function check(inp,fb){
 if(TS.solved)return;
 const v=parseAns(inp.value);
 if(v===null){fb.className='fb info';fb.textContent='Введите ответ в поле выше.';inp.focus();return}
 if(Number.isNaN(v)){fb.className='fb info';fb.textContent='Не получилось прочитать ответ. Пример записи: 12, −3, 0,75, 3/4 или 1 1/2.';inp.setAttribute('aria-invalid','true');inp.focus();return}
 inp.removeAttribute('aria-invalid');
 if(same(v,TS.p.a)){
  const first=TS.tries===0&&!TS.shown,was=done(TS.topic,TS.level);TS.solved=true;
  if(first)bump(TS.topic,TS.level);
  const nowDone=done(TS.topic,TS.level),c=Math.min(prog(TS.topic)[TS.level-1],NEED);
  const val=inp.value;renderTopic(TS.topic,'practice',TS.level);
  const i2=document.getElementById('answer'),f2=document.getElementById('fb');i2.value=val;
  f2.className='fb ok';
  f2.textContent=first?(nowDone&&!was?`Верно! Уровень «${LV[TS.level-1].name}» освоен.`:`Верно с первой попытки! Засчитано: ${c} из ${NEED}.`):'Верно! Эта задача не засчитывается в прогресс, потому что была ошибка или открыто решение.';
  document.getElementById('nextp').focus();
 }else{TS.tries++;fb.className='fb bad';fb.textContent=`Неверно. Попробуйте ещё раз или откройте пошаговое решение.`;inp.select()}
}

/* ================= маршрутизация ================= */
let lastView='';
function route(){
 const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);let view;
 if(parts[0]==='topic'&&TOPIC[parts[1]]){renderTopic(parts[1],parts[2]||'theory',[1,2,3].includes(+parts[3])?+parts[3]:null);view='t:'+parts[1]+':'+(parts[2]||'theory')}
 else{let g=+parts[1];if(parts[0]!=='grade'||!GRADES.includes(g))g=GRADES.includes(+store.get('shm.grade',5))?+store.get('shm.grade',5):5;renderHome(g);view='h'}
 if(view!==lastView){if(lastView)window.scrollTo(0,0);lastView=view}
 renderReset();
}
function renderReset(){const el=document.getElementById('reset');el.innerHTML=`<button class="linkbtn" type="button" id="rst">Сбросить прогресс</button>`;
 el.querySelector('#rst').addEventListener('click',()=>{el.innerHTML=`<span class="confirm">Удалить весь прогресс? <button class="linkbtn" type="button" id="rsy">Да, сбросить</button><button class="linkbtn" type="button" id="rsn">Отмена</button></span>`;
  el.querySelector('#rsy').addEventListener('click',()=>{progress={};store.set('shm.progress.v1',progress);route()});el.querySelector('#rsn').addEventListener('click',renderReset);el.querySelector('#rsn').focus()})}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
